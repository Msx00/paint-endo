# ReObsDiff defaults. Boolean switches map directly to A1--A5 ablations.
height: 512
width: 640
depth_source: foundationstereo
foundation_cache: foundation_stereo_metric_depth
use_e1_camera_geometry: true
pose_mode: mixture
e1_like_probability: 0.70
candidate_count: 16
retry_scales: [1.0, 0.5, 0.25]
translation_mm: 5.0
rotation_deg: 2.0
min_overlap: 0.55
min_hole_ratio: 0.05
max_hole_ratio: 0.35
target_hole_ratio: 0.20
min_reobs_ratio: 0.30
temporal_window: 2
temporal_tau: 1.0
depth_consistency_relative: 0.03
depth_consistency_mm: 0.0
reobs_max_photometric_error: 0.20
mask_mode: all_geometry
mask_min_component: 32
mask_dilation: 3
use_reciprocal_training: true
use_reobs_loss: true
use_stereo_reobs: true
use_temporal_reobs: true
use_reobs_confidence: true
use_known_loss: true
use_hard_composition: true
lambda_mask: 3.0
lambda_boundary: 2.0
lambda_reobs: 1.0
lambda_grad: 0.1
lambda_known: 0.1
snr_gamma: 5.0
reobs_max_timestep: 800
x0_latent_clip: 10.0
lora_rank: 16
seed: 6666
